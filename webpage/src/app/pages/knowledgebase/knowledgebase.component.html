<h2 class="text-2xl font-semibold mb-4">Knowledgebase Editor</h2>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
  <textarea [value]="content"
            (input)="content = $any($event.target).value"
            class="w-full h-60 border rounded p-2"
            placeholder="Write content here..."></textarea>

  <div class="border rounded p-4 bg-gray-50 h-60 overflow-auto">
    <h3 class="font-semibold mb-2">Preview</h3>
    <pre class="whitespace-pre-wrap">{{ content }}</pre>
  </div>
</div>

<button (click)="save()" class="px-4 py-2 bg-green-600 text-white rounded">Save</button>

<div *ngIf="savedMessage" class="mt-2 text-green-700">{{ savedMessage }}</div>
